<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#bfe3ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PATPAT</title>
  <script type="module" crossorigin src="./assets/index-YcCiHugt.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/skins-CrWZkuRM.js">
  <link rel="stylesheet" crossorigin href="./assets/index-DXHcSa5n.css">
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="boot" aria-hidden="true"><div class="boot-logo">PATPAT</div><div class="boot-dots"><i></i><i></i><i></i></div></div>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-level" id="hud-level">DAĞ 1</div>
        <div class="hud-progress">
          <div class="bar"><div class="fill" id="hud-prog"></div><div class="dot" id="hud-dot"></div></div>
          <span class="town">🏘️</span>
        </div>
        <button class="icon-btn" id="btn-pause" aria-label="Durdur">❚❚</button>
      </div>
      <div class="hud-tons" id="hud-tons">0 kg</div>
      <div class="hud-goal hidden" id="hud-goal"><div class="goal-fill" id="hud-goal-fill"></div><i class="goal-amber" id="hud-goal-amber"></i><i class="goal-red" id="hud-goal-red"></i><i class="goal-tick" id="hud-gt0"></i><i class="goal-tick" id="hud-gt1"></i><i class="goal-tick" id="hud-gt2"></i><span class="goal-lbl" id="hud-goal-lbl"></span></div>
      <div id="hud-chal" class="hidden"></div>
      <div class="hud-combo" id="hud-combo"></div>
      <div class="hud-coins hidden" id="hud-coins">❄️ 0</div>
      <div class="hud-vitals hidden" id="hud-vitals">
        <div class="pips" id="hud-pips"></div>
        <div class="growbar" id="hud-growbar"><div class="growfill" id="hud-grow"></div></div>
        <div class="powers" id="hud-powers"></div>
      </div>
      <div class="hunger hidden" id="hunger" aria-label="Boyut"><span class="hg-ico" id="hg-ico">⛄</span><div class="hg-bar"><i class="hg-fill" id="hg-fill"></i></div></div>
      <div class="hud-flow hidden" id="hud-flow"><span class="flow-lbl" id="hud-flow-lbl">AKIŞ</span><div class="flowbar"><div class="flowfill" id="hud-flow-fill"></div></div></div>
      <div class="hud-record hidden" id="hud-record"></div>
      <div class="buffs" id="buffs"></div>
      <div class="cig-hud hidden" id="cig-hud">
        <div class="cg-tier"><span class="cg-tn" id="cg-tn"></span><div class="cg-bar"><i id="cg-fill"></i></div></div>
        <div class="cg-row"><span id="cg-dist">0 m</span><span id="cg-best"></span></div>
      </div>
      <div class="hud-yeti hidden" id="hud-yeti">
        <span class="yeti-ico">👣</span>
        <div class="yetibar"><div class="yetifill" id="hud-yetifill"></div></div>
        <span class="yeti-lbl" id="hud-yeti-lbl"></span>
      </div>
    </div>

    <div id="speedlines"></div>
    <div id="flash"></div>
    <div id="perks" class="hidden"><div class="perk-title" id="perk-title">BİR GÜÇ SEÇ</div><div class="perk-cards" id="perk-cards"></div></div>
    <div id="danger" class="hidden"></div>
    <div id="turn-cue" class="hidden"><div class="tc-chev"></div><div class="tc-lbl">DÖN!</div></div>
    <div id="floats"></div>
    <div id="markers"></div>
    <div id="banner"></div>
    <div id="buff-fly"></div>
    <div id="stomp" class="hidden"></div>
    <div id="cig-banner" class="hidden"><div class="cb-k">YENİ BÖLGE!</div><div class="cb-n" id="cb-n"></div></div>
    <div id="toast-soft" aria-live="polite"></div>
    <div id="tutor" class="hidden"><div class="tt-icon"></div><div class="tt-title"></div><div class="tt-text"></div></div>
    <div id="hint" class="hidden"><div class="finger">👆</div><div>sürükle</div></div>
    <div id="subtitle"></div>
    <div id="revive-panel" class="hidden">
      <div class="rv-card">
        <div class="rv-title" id="rv-title">PATLADIN!</div>
        <div class="rv-dist" id="rv-dist">0 m</div>
        <button class="btn big" id="btn-revive">DEVAM ET</button>
        <button class="btn mid alt" id="btn-revive-end">BİTİR</button>
      </div>
    </div>

    <!-- Legacy start screen: kept only because ui.showMenu() writes to it. The real menu lives in menus.js. -->
    <div id="menu" class="screen hidden">
      <div class="logo">PATPAT</div>
      <div class="tagline">kartopu · yeti · çığ</div>
      <div class="menu-card">
        <div class="menu-level" id="menu-level">DAĞ 1</div>
        <div class="menu-stars" id="menu-stars"></div>
        <button class="btn big endless" id="btn-endless"><span class="badge">YENİ</span>∞ YETİ RUSH</button>
        <div class="menu-best" id="menu-best"></div>
        <button class="btn big" id="btn-play">BAŞLA</button>
        <button class="btn daily" id="btn-daily">🏔️ GÜNÜN DAĞI</button>
      </div>
      <div class="toggles">
        <button class="icon-btn" id="btn-sound" aria-label="Ses">🔊</button>
        <button class="icon-btn" id="btn-haptic" aria-label="Titreşim">📳</button>
        <button class="icon-btn wide" id="btn-shop" aria-label="Dolap">👕 DOLAP</button>
        <button class="icon-btn wide" id="btn-visual" aria-label="Görünüm">🎨 NORMAL</button>
      </div>
    </div>

    <div id="result" class="screen hidden">
      <div class="res-top">
        <div class="res-title" id="res-title">KASABA YERLE BİR!</div>
        <div class="res-badge hidden" id="res-badge">YENİ REKOR!</div>
        <div class="res-stars" id="res-stars"><span>★</span><span>★</span><span>★</span></div>
        <div class="res-pct" id="res-pct">%0</div>
        <div class="res-label" id="res-label">kasaba yıkıldı</div>
        <div class="res-tons" id="res-tons">0 ton</div>
        <div class="res-sub" id="res-sub"></div>
      </div>
      <div class="res-mid">
        <div class="res-coins hidden" id="res-coins"></div>
        <div class="res-extra hidden" id="res-extra"></div>
      </div>
      <div class="res-actions">
        <button class="btn big next" id="btn-next">SONRAKİ DAĞ ▶</button>
        <button class="btn big retry" id="btn-retry">↻ TEKRAR</button>
        <div class="row three">
          <button class="btn mid alt" id="btn-menu">⌂ MENÜ</button>
          <button class="btn mid share" id="btn-share">PAYLAŞ</button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <div id="pause" class="screen hidden">
      <div class="pause-card">
        <div class="pause-title">DURDU</div>
        <div class="pause-stats" id="pause-stats"></div>
        <button class="btn big" id="btn-resume">▶ DEVAM</button>
        <div class="pause-row">
          <button class="btn mid alt" id="btn-restart">↻ TEKRAR</button>
          <button class="btn mid alt" id="btn-quit">⌂ MENÜ</button>
        </div>
        <div class="pause-toggles">
          <button class="icon-btn" id="btn-p-sound" aria-label="Ses">🔊</button>
          <button class="icon-btn" id="btn-p-music" aria-label="Müzik">🎵</button>
          <button class="icon-btn" id="btn-p-haptic" aria-label="Titreşim">📳</button>
        </div>
      </div>
    </div>

    <div id="debug" class="hidden"></div>
  </div>
</body>
</html>
